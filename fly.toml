app = "hana-beauty-kz"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  DATA_DIR = "/data"
  COOKIE_SECURE = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "hana_data"
  destination = "/data"
